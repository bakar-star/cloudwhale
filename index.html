/* boosts only exist if you bought them in the shop, and never more than 3 chunks in a row */
{const roll=rnd()<.07+rnd()*.09+ownedB.length*.006,z=al>STORM?'Outer Space':al>1000?'Pink Sky':'Blue Sky',zi=['Blue Sky','Pink Sky','Outer Space'],zl=zi.slice(0,zi.indexOf(z)+1),

else if(T===1){const n=8+(r()*3|0);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;P(sx+40+Math.cos(a)*30,cy+Math.sin(a)*30)}}
else if(T===2){const A=2+(r()*3|0),B=2+(r()*2|0);for(let a=0;a<A;a++)for(let b=0;b<B;b++)P(sx+a*24,cy+b*24)}
else if(T===3){const n=6+(r()*3|0);for(let i=0;i<n;i++)P(sx+i*28,cy+(i%2?20:-20))}
else if(T===4){for(let i=0;i<7;i++)P(sx+i*26,cy-Math.sin(i/6*Math.PI)*36)}
else if(T===5){const n=5+(r()*3|0),d=r()<.5?-1:1;for(let i=0;i<n;i++)P(sx+i*26,cy+i*14*d)}
else if(T===6){for(let i=0;i<7;i++)P(sx+i*24,cy+Math.abs(i-3)*14)}
else if(T===7){const n=5+(r()*4|0);for(let i=0;i<n;i++)P(sx+r()*90,cy+(r()-.5)*90)}
else{for(let row=-1;row<=1;row++)for(let i=0;i<4;i++)P(sx+i*24+(row?12:0),cy+row*22)}
