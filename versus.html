<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cloud Whale – 2 Player</title>
<style>
html,body{margin:0;height:100%;background:#06232f;font-family:system-ui,sans-serif;color:#fff;overflow:hidden}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f8fb8;text-align:center;padding:20px}
#menu button{font:700 18px system-ui;padding:14px 22px;border:0;border-radius:14px;background:#8a2ee0;color:#fff;min-width:260px;cursor:pointer}
#menu small{opacity:.85;max-width:420px;line-height:1.4}
#menu a{color:#fff}
#game{position:fixed;inset:0;display:none}
iframe{position:absolute;border:0;background:#000}
</style></head><body>
<div id="menu">
  <h1>Cloud Whale – 2 Player</h1>
  <button data-m="race">Race (furthest wins)</button>
  <button data-m="last">Last whale standing</button>
  <small>P1: <b>W</b> / Space, or tap the P1 screen. P2: <b>↑</b> / Enter, or tap the P2 screen.<br>
  <b>R</b> = rematch, <b>Esc</b> = back here.<br>Rainbow donuts and bounce combos sabotage the other player.</small>
  <a href="index.html">← Back to game</a>
</div>
<div id="game"><iframe id="a"></iframe><iframe id="b"></iframe></div>
<script>
const A=document.getElementById('a'),B=document.getElementById('b'),G=document.getElementById('game'),M=document.getElementById('menu');
let mode='race',round=0,loaded=0;
const area=(w,h)=>w>=h?Math.min(w/640,h/360):.001; // avoid portrait panes (the game would rotate itself)
function layout(){const W=innerWidth,H=innerHeight,stack=area(W,H/2)>=area(W/2,H);
  if(stack){A.style.cssText=`left:0;top:0;width:${W}px;height:${H/2}px`;B.style.cssText=`left:0;top:${H/2}px;width:${W}px;height:${H/2}px`}
  else{A.style.cssText=`left:0;top:0;width:${W/2}px;height:${H}px`;B.style.cssText=`left:${W/2}px;top:0;width:${W/2}px;height:${H}px`}}
addEventListener('resize',layout);
function begin(m){mode=m;M.style.display='none';G.style.display='block';layout();loaded=0;
  A.src='index.html?local=1&me=p1&n=P1';B.src='index.html?local=1&me=p2&n=P2'}
function start(){const m={seed:Math.random()*1e9|0,mode,count:2,round:++round,startAt:Date.now()+3500};
  A.contentWindow.postMessage({start:m},'*');B.contentWindow.postMessage({start:m},'*')}
[A,B].forEach(f=>f.onload=()=>{if(f.src.includes('index.html')&&++loaded===2)start()});
function home(){A.src='about:blank';B.src='about:blank';G.style.display='none';M.style.display='flex'}
function key(code,rep){if(rep)return;
  if(code==='KeyW'||code==='Space')A.contentWindow.postMessage({flap:1},'*');
  else if(code==='ArrowUp'||code==='Enter')B.contentWindow.postMessage({flap:1},'*');
  else if(code==='KeyR'&&G.style.display==='block')start();
  else if(code==='Escape')home()}
M.querySelectorAll('button').forEach(b=>b.onclick=()=>begin(b.dataset.m));
const pm=new URLSearchParams(location.search).get('mode');if(pm)begin(pm);
addEventListener('keydown',e=>{if(['Space','ArrowUp','Enter'].includes(e.code))e.preventDefault();key(e.code,e.repeat)});
addEventListener('message',e=>{const d=e.data||{};
  if(d.mp)(e.source===A.contentWindow?B:A).contentWindow.postMessage(d,'*');
  else if(d.key)key(d.key,d.rep);
  else if(d.rematch)start();
  else if(d.home)home()});
</script></body></html>
